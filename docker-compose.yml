services:
  db:
    image: postgres:16
    container_name: speakup_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_pass
      POSTGRES_DB: english_academy_db
    ports:
      - "5432:5432"
    volumes:
      - speakup_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d english_academy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: speakup_backend:latest
    container_name: speakup_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://academy:academy_pass@db:5432/english_academy_db?schema=public"
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  studio:
    image: speakup_backend:latest
    container_name: speakup_studio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://academy:academy_pass@db:5432/english_academy_db?schema=public"
    ports:
      - "5555:5555"
    command: npx prisma studio --browser none --port 5555

volumes:
  speakup_db_data:
